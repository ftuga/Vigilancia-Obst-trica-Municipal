[project]
name = "ent-tesis"
version = "0.1.0"
description = "MME Colombia — Índice de Vulnerabilidad Obstétrica Municipal (MLOps end-to-end)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=14.0",
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "requests>=2.31",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
# CLI entry points (thin wrappers sobre src/mme/)
mme-ingest-sivigila = "mme.cli.ingest:ingest_sivigila"
mme-ingest-sivigila-mm = "mme.cli.ingest:ingest_sivigila_mm"
mme-ingest-divipola = "mme.cli.ingest:ingest_divipola"
mme-ingest-censo-nbi = "mme.cli.ingest:ingest_censo_nbi"
mme-ingest-censo-poblacion = "mme.cli.ingest:ingest_censo_poblacion"
mme-ingest-bdua = "mme.cli.ingest:ingest_bdua"
mme-ingest-reps = "mme.cli.ingest:ingest_reps"
mme-ingest-dane-eevv = "mme.cli.ingest:ingest_dane_eevv"
mme-build-silver = "mme.cli.build:build_silver"
mme-build-gold = "mme.cli.build:build_gold"
mme-train-c3 = "mme.cli.train:train_c3"
mme-eda-target = "mme.cli.eda:eda_target"
mme-eda-features = "mme.cli.eda:eda_features"
mme-feature-selection = "mme.cli.eda:feature_selection"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mme"]

[tool.uv.workspace]
members = []

# ─── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = [
    "integration: tests end-to-end que requieren stack (MinIO, MLflow, etc.)",
    "slow: tests que toman >10s",
]

[tool.coverage.run]
source = ["src/mme"]
omit = ["*/cli/*", "tests/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

# ─── ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["mlruns_rugpull_archive", "proyecto_01/minio", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",          # pycodestyle + pyflakes
    "I",                     # isort
    "N",                     # pep8-naming
    "UP",                    # pyupgrade
    "B",                     # flake8-bugbear
    "C4",                    # flake8-comprehensions
    "SIM",                   # flake8-simplify
    "TID",                   # flake8-tidy-imports
    "TCH",                   # flake8-type-checking
    "ARG",                   # flake8-unused-arguments
    "PTH",                   # flake8-use-pathlib
    "RET",                   # flake8-return
    "PL",                    # pylint
    "TRY",                   # tryceratops
    "PERF",                  # perflint
    "D",                     # pydocstyle (Google style)
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "PLR0913",  # too many arguments (ML training funcs legítimamente tienen muchos)
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG", "PLR2004"]  # tests no requieren docstrings
"scripts/**" = ["D100", "D101", "D102", "D103"]  # scripts thin CLI
"src/mme/cli/**" = ["D"]  # CLI wrappers

# ─── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true  # para deps sin stubs como duckdb, shap
exclude = [
    "mlruns_rugpull_archive/",
    "proyecto_01/minio/",
    "scripts/mme/(train_c3_v1|train_baselines_c3)\\.py$",  # legacy, en refactor
]

[[tool.mypy.overrides]]
module = ["duckdb.*", "shap.*", "optuna.*", "lightgbm.*", "xgboost.*",
          "statsmodels.*", "mlflow.*", "evidently.*"]
ignore_missing_imports = true

# ─── dev deps ────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    # ML stack
    "scikit-learn>=1.8.0",
    "lightgbm>=4.6.0",
    "xgboost>=2.0,<3",
    "statsmodels>=0.14.6",
    "shap>=0.51.0",
    "optuna>=4.8.0",
    "mlflow>=3.11.1",
    "evidently>=0.6,<1.0",
    "boto3>=1.42.95",
    "matplotlib>=3.10.8",
    # I/O
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    # CLI
    "typer>=0.15",
    # Testing + Quality
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.6.9",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]
