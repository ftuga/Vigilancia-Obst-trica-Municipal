# Default global para timers: histogram (permite histogram_quantile).
# Cada regla timer puede override con observer_type: summary si lo necesita.
defaults:
  observer_type: histogram
  histogram_options:
    buckets: [0.1, 0.5, 1, 2.5, 5, 10, 30, 60, 120, 300, 600]

mappings:
  # ── Airflow StatsD → Prometheus
  # Referencia: https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/metrics.html
  #
  # Notas críticas:
  # · Airflow sanitiza dag_id/task_id reemplazando `-` por `_` antes de enviar StatsD.
  # · task_ids dentro de TaskGroups conservan `.` como separador (ej. bronze.to_bronze).
  # · Por eso dag_id = [^.]+ (un sólo segmento) y task_id = .+ (puede contener puntos).
  # · match_type: regex es obligatorio cuando hay captura multi-segmento.

  # ───── Scheduler
  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat"
    help: "Scheduler heartbeat"

  - match: "airflow\\.scheduler\\.tasks\\.(.+)"
    match_type: regex
    name: "airflow_scheduler_tasks"
    labels:
      status: "$1"

  - match: "airflow\\.scheduler\\.critical_section_duration"
    match_type: regex
    name: "airflow_scheduler_critical_section_duration_seconds"

  # ───── Executor (un sólo segmento)
  - match: "airflow\\.executor\\.open_slots"
    match_type: regex
    name: "airflow_executor_open_slots"
  - match: "airflow\\.executor\\.queued_tasks"
    match_type: regex
    name: "airflow_executor_queued_tasks"
  - match: "airflow\\.executor\\.running_tasks"
    match_type: regex
    name: "airflow_executor_running_tasks"

  # ───── DAG-run duration: airflow.dagrun.duration.<status>.<dag_id>
  - match: "airflow\\.dagrun\\.duration\\.(success|failed)\\.(.+)"
    match_type: regex
    name: "airflow_dagrun_duration_seconds"
    labels:
      status: "$1"
      dag_id: "$2"

  # ───── DAG-run schedule delay: airflow.dagrun.schedule_delay.<dag_id>
  - match: "airflow\\.dagrun\\.schedule_delay\\.(.+)"
    match_type: regex
    name: "airflow_dagrun_schedule_delay_seconds"
    labels:
      dag_id: "$1"

  # ───── DAG-run first task scheduling delay
  - match: "airflow\\.dagrun\\.first_task_scheduling_delay\\.(.+)"
    match_type: regex
    name: "airflow_dagrun_first_task_scheduling_delay_seconds"
    labels:
      dag_id: "$1"

  # ───── DAG-run dependency check
  - match: "airflow\\.dagrun\\.dependency-check\\.(.+)"
    match_type: regex
    name: "airflow_dagrun_dependency_check_seconds"
    labels:
      dag_id: "$1"

  # ───── Task duration: airflow.dag.<dag_id>.<task_id>.duration
  #       (task_id puede tener dots por TaskGroups)
  - match: "airflow\\.dag\\.([^.]+)\\.(.+)\\.duration"
    match_type: regex
    name: "airflow_task_duration_seconds"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow\\.dag\\.([^.]+)\\.(.+)\\.queued_duration"
    match_type: regex
    name: "airflow_task_queued_duration_seconds"
    labels:
      dag_id: "$1"
      task_id: "$2"

  # ───── Task instance finish: airflow.ti_finish.<dag_id>.<task_id>.<state>
  - match: "airflow\\.ti_finish\\.([^.]+)\\.(.+)\\.(success|failed|skipped|up_for_retry|up_for_reschedule|upstream_failed|running|queued|scheduled|removed|restarting|shutdown|deferred|None)"
    match_type: regex
    name: "airflow_ti_finish_total"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"

  # ───── Task instance start: airflow.ti.start.<dag_id>.<task_id>
  - match: "airflow\\.ti\\.start\\.([^.]+)\\.(.+)"
    match_type: regex
    name: "airflow_ti_start_total"
    labels:
      dag_id: "$1"
      task_id: "$2"

  # ───── Operator successes / failures: airflow.operator_<action>_<OperatorClass>
  - match: "airflow\\.operator_(failures|successes)_(.+)"
    match_type: regex
    name: "airflow_operator_$1_total"
    labels:
      operator: "$2"

  # ───── Pool metrics: airflow.pool.<metric>.<pool_name>
  - match: "airflow\\.pool\\.([^.]+)\\.(.+)"
    match_type: regex
    name: "airflow_pool_$1"
    labels:
      pool: "$2"

  # ───── DAG processing
  - match: "airflow\\.dag_processing\\.last_duration\\.(.+)"
    match_type: regex
    name: "airflow_dag_processing_last_duration_seconds"
    labels:
      dag_file: "$1"
  - match: "airflow\\.dag_processing\\.last_runtime\\.(.+)"
    match_type: regex
    name: "airflow_dag_processing_last_runtime_seconds"
    labels:
      dag_file: "$1"
  - match: "airflow\\.dag_processing\\.total_parse_time"
    match_type: regex
    name: "airflow_dag_processing_total_parse_time_seconds"

  # ───── ti_failures / ti_successes (counters globales sin labels)
  - match: "airflow.ti_failures"
    name: "airflow_ti_failures_total"
  - match: "airflow.ti_successes"
    name: "airflow_ti_successes_total"

  # ───── Fallback genérico para cualquier otra métrica airflow.*
  #       Mantiene el nombre completo pero reemplaza `.` por `_`.
  - match: "airflow.*"
    name: "airflow_${1}"
