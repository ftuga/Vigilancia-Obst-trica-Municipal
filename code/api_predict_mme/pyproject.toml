[project]
name = "api-predict-mme"
version = "0.1.0"
description = "FastAPI de serving del modelo C3 de vulnerabilidad obstétrica municipal"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "httpx>=0.27",
    "mlflow>=3.11.1",
    "lightgbm>=4.6.0",
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "pyarrow>=14.0",
    "duckdb>=1.0",
    "scipy>=1.11",
    "statsmodels>=0.14.6",
    "scikit-learn>=1.8.0",
    "boto3>=1.34",
    # Importamos directamente el paquete mme vía PYTHONPATH en Docker
    # (se puede formalizar con wheel editable cuando se extraiga a repo propio).
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.9",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "ANN401", "COM812", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN", "INP001"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
