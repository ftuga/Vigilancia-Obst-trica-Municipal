site_name: Vigilancia Obstétrica Municipal — Arquitectura MLOps
site_description: Ejercicio investigativo · Arquitectura MLOps GitOps sobre microk8s para predicción de vulnerabilidad obstétrica municipal
site_author: Luis Frontuso
repo_url: https://github.com/ftuga/Vigilancia-Obst-trica-Municipal
repo_name: ftuga/Vigilancia-Obst-trica-Municipal
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Modo claro
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Arquitectura: architecture.md
  - Datos:
    - Fuentes y medallón: data-sources.md
    - DAGs: dags.md
  - Serving:
    - API + Frontend: api.md
  - Plataforma:
    - GitOps (ArgoCD): gitops.md
    - CI/CD: ci-cd.md
    - Observabilidad: observability.md
    - Seguridad: security.md
  - Decisiones:
    - ADRs: adrs.md
  - Runbook: runbook.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ftuga
