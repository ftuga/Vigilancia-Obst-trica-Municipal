apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: apps
  labels:
    app.kubernetes.io/name: locust
    app.kubernetes.io/part-of: vigilancia-obstetrica-municipal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: locust
  template:
    metadata:
      labels:
        app.kubernetes.io/name: locust
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: locust
          image: locustio/locust:2.31.5
          imagePullPolicy: IfNotPresent
          args:
            - "-f"
            - "/scripts/locustfile.py"
            - "--host=http://api-predict-mme.apps:8001"
            - "--web-host=0.0.0.0"
            - "--web-port=8089"
          ports:
            - name: web
              containerPort: 8089
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: script
          configMap:
            name: locust-script
