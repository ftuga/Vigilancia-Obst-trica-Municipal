apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-predict-mme
  namespace: apps
  labels:
    app.kubernetes.io/name: api-predict-mme
    app.kubernetes.io/part-of: vigilancia-obstetrica-municipal
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-predict-mme
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-predict-mme
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: luisfrontuso10/mme-api-predict:20260425-89dd2a9
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: API_MME_MLFLOW_TRACKING_URI
              value: "http://mlflow-tracking.mlflow:80"
            - name: API_MME_REGISTERED_MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: mme-env
                  key: MLFLOW_REGISTRY_MODEL_NAME
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlflow-s3
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-s3
                  key: AWS_SECRET_ACCESS_KEY
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.data:9000"
          envFrom:
            - configMapRef:
                name: mme-env
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 2Gi
              cpu: 2000m
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
