apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-mme
  namespace: apps
  labels:
    app.kubernetes.io/name: frontend-mme
    app.kubernetes.io/part-of: vigilancia-obstetrica-municipal
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-mme
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-mme
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: luisfrontuso10/mme-frontend:20260426-11616d5
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            # API_PREDICT_MME_URL viene del ConfigMap mme-env (apunta a 8001).
            # No hardcodear acá — env inline pisa envFrom y rompía con port viejo.
            - name: NODE_ENV
              value: production
          envFrom:
            - configMapRef:
                name: mme-env
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
          # Probes TCP: la home `/` hace SSR + fetch al API y excede el
          # timeout de http probes en cold start. TCP solo verifica que
          # Next esté escuchando — suficiente para liveness/readiness.
          startupProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
