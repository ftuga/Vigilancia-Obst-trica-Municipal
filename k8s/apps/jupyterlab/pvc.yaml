apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-notebooks
  namespace: apps
  labels:
    app.kubernetes.io/name: jupyterlab
    app.kubernetes.io/part-of: vigilancia-obstetrica-municipal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 2Gi
