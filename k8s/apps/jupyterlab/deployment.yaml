apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterlab
  namespace: apps
  labels:
    app.kubernetes.io/name: jupyterlab
    app.kubernetes.io/part-of: vigilancia-obstetrica-municipal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jupyterlab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jupyterlab
    spec:
      # ndots:1 para evitar DNS hijack via search domain del host WSL.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
      containers:
        - name: jupyter
          image: luisfrontuso10/mme-jupyterlab:20260426-51e574d
          imagePullPolicy: Always
          # Sin auth: red privada del cluster, acceso vía NodePort en LAN local.
          args:
            - "start-notebook.sh"
            - "--ServerApp.token="
            - "--ServerApp.password="
            - "--ServerApp.disable_check_xsrf=True"
            - "--ServerApp.allow_origin=*"
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: JUPYTER_ENABLE_LAB
              value: "yes"
            - name: NB_UMASK
              value: "002"
            # MLflow tracking + S3 (acceso desde notebooks).
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-tracking.mlflow:80"
            # Acceso al medallón compartido.
            - name: MME_DATA_ROOT
              value: "/home/jovyan/data/mme"
            - name: MME_REPORTS_ROOT
              value: "/home/jovyan/data/mme/reports"
            - name: PYTHONPATH
              value: "/home/jovyan/work/src"
          envFrom:
            - configMapRef:
                name: mme-env
            - secretRef:
                name: mlflow-auth
            - secretRef:
                name: mlflow-s3
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 4Gi
              cpu: 2000m
          volumeMounts:
            - name: notebooks
              mountPath: /home/jovyan/work
            - name: mme-data
              mountPath: /home/jovyan/data/mme
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: notebooks
          persistentVolumeClaim:
            claimName: jupyter-notebooks
        - name: mme-data
          persistentVolumeClaim:
            claimName: mme-data
