apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgadmin-data
  namespace: apps
  labels:
    app.kubernetes.io/name: pgadmin
    app.kubernetes.io/part-of: vigilancia-obstetrica-municipal
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 1Gi
