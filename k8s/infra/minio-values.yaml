fullnameOverride: minio

mode: standalone

existingSecret: minio-creds

persistence:
  enabled: true
  size: 50Gi
  storageClass: microk8s-hostpath

resources:
  requests:
    memory: 512Mi
    cpu: 200m
  limits:
    memory: 2Gi
    cpu: 2000m

service:
  type: NodePort
  nodePort: 30900

consoleService:
  type: NodePort
  nodePort: 30901

buckets:
  - name: mlflows3
    policy: none
    purge: false

postJob:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m

makeBucketJob:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m

metrics:
  serviceMonitor:
    enabled: true
    namespace: data
    additionalLabels:
      release: kube-prom-stack
