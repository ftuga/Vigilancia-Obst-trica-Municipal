apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: mlflow
      targetRevision: 5.1.17
      helm:
        releaseName: mlflow
        valueFiles:
          - $values/k8s/infra/mlflow-values.yaml
    - repoURL: https://github.com/ftuga/Vigilancia-Obst-trica-Municipal.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
