apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-airflow
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: postgresql
      targetRevision: 18.6.2
      helm:
        releaseName: postgres-airflow
        valueFiles:
          - $values/k8s/infra/postgres-airflow-values.yaml
    - repoURL: https://github.com/ftuga/Vigilancia-Obst-trica-Municipal.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: airflow
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
