apiVersion: v1
kind: Secret
metadata:
  name: helm-repo-airflow
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: helm
  url: https://airflow.apache.org
  name: apache-airflow
  insecure: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: helm-repo-bitnami-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  # Bitnami HTTPS repo (charts.bitnami.com) está deprecado y devuelve "invalid_reference".
  # Charts oficiales actuales viven en OCI registry public.
  type: helm
  url: registry-1.docker.io/bitnamicharts
  name: bitnami-oci
  enableOCI: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: helm-repo-minio
